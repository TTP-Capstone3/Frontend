<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      GOOGLE FONTS
      This LOADS the font. Naming it for use lives elsewhere (in CSS).
      Get these tags from fonts.google.com -> pick a font -> "Get font" ->
      "Get embed code". Then use the family in your CSS, e.g.
        font-family: 'Manrope', sans-serif;   (see src/index.css)

      - preconnect: opens an early connection to Google's servers so the font
        downloads a little faster.
      - the stylesheet <link>: fetches the actual font. The URL encodes which
        family and weights you want (here Manrope, weights 200-800).
      - display=swap: show fallback text immediately, swap in the font once it
        loads (avoids invisible text while the font downloads).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agenta</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
