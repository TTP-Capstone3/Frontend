<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <style>
    /* Ink on light backgrounds, reversed on dark, so the tab icon stays legible
       in either browser theme. */
    .ink path { stroke: #08060d; fill: none; }
    .ink rect { fill: #08060d; stroke: none; }

    @media (prefers-color-scheme: dark) {
      .ink path { stroke: #f3f4f6; }
      .ink rect { fill: #f3f4f6; }
    }
  </style>

